# Her gönderimde: testleri çalıştırır ve Windows kurulum dosyasını üretir.
# Kurulum dosyası: GitHub → Actions → son çalıştırma → "Artifacts" → NusmacDocument-Windows
# "v1.5.0" gibi bir etiket gönderilirse dosyalar ayrıca "Releases" sayfasına konur.
name: Test ve Windows kurulum

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: xvfb-run -a npm run test:electron
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-ciktilari, path: test-output/ }

  windows:
    needs: test
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NusmacDocument-Windows
          path: |
            dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'dist/*.exe' }
