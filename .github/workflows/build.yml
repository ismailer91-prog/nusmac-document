# Her gönderimde: testleri çalıştırır ve Windows kurulum dosyasını üretir.
# Kurulum dosyası: GitHub → Actions → son çalıştırma → "Artifacts" → NusmacDocument-Windows
# main dalına her gönderimde dosyalar ayrıca "Releases" sayfasına konur (sürüm package.json'dan).
name: Test ve Windows kurulum

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: xvfb-run -a npm run test:electron
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-ciktilari, path: test-output/ }

  windows:
    needs: test
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NusmacDocument-Windows
          path: |
            dist/*.exe
      # main dalına her gönderimde: package.json sürümüyle (ör. v1.6.0) "Releases" sayfasına konur.
      # Aynı sürüm tekrar gönderilirse dosyalar güncellenir.
      - id: ver
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Nusmac Document ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows için indirin:
            - **NusmacDocument-Kurulum-${{ steps.ver.outputs.v }}.exe** – kurulum (masaüstü kısayolu, PDF'e sağ tık "Birlikte aç")
            - **NusmacDocument-Tasinabilir-${{ steps.ver.outputs.v }}.exe** – kurulumsuz, çift tıklayınca açılır
            İlk açılışta Windows uyarı verirse: Ek bilgi → Yine de çalıştır.
          files: dist/*.exe
